# Weekly update PRs. Actions stay pinned to full commit SHAs; Dependabot bumps the SHA and the
# version comment together. Every PR runs test.yml; nothing merges or deploys by itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
