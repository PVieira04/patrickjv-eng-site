# Daily check of the live site. A failed scheduled run emails the repo owner (GitHub default).
# Read-only: no secrets. Never calls request_intro.
name: monitor
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: did.json byte-identical, pages, redirects, MCP handshake
        run: node smoke.mjs https://patrickjv.com --aliases --mcp
