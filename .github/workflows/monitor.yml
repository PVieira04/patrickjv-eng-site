# Checks the live site every 6 hours (and on demand). A failed scheduled run notifies according to
# the owner's GitHub Actions notification settings. Read-only: no secrets. Never calls request_intro.
name: monitor
on:
  schedule:
    - cron: "17 */6 * * *" # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: did.json, pages, headers, redirects, MCP lifecycle, Registry
        shell: bash
        run: |
          set +e
          node smoke.mjs https://patrickjv.com --aliases --mcp --registry --strict-https > smoke.out 2>&1
          rc=$?
          cat smoke.out
          {
            echo "### Smoke: $([ $rc -eq 0 ] && echo passed || echo FAILED)"
            echo '```'
            cat smoke.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
