# Fails loudly when a push to main gets no Cloudflare Workers Builds deploy of the site. Workers
# Builds sometimes silently drops a main build that arrives while a branch build is running (it
# happened to #28 and #31): no check run, no failure, nothing deployed. See docs/06 ("Monitoring").
#
# - If every file the push changed is outside the site's build watch paths (the excludes docs/*,
#   README.md, designs/*), there is no build to expect: pass without checking.
# - Otherwise poll the pushed commit's check runs every 60 s for up to 12 minutes for
#   "Workers Builds: patrickjv-eng-site" (app cloudflare-workers-and-pages): success passes; any
#   other conclusion fails naming the build; no check run at all fails ("Cloudflare didn't build").
#   A build seen but still running at 12 minutes passes with a notice: monitor.yml's build-result
#   job alerts on its result.
#
# Cost: one small job, no checkout, about 12 minutes at worst per main push — free, as Actions
# minutes on standard runners are free for public repos. Read-only: only the run's own GITHUB_TOKEN.
name: deploy-watch
on:
  push:
    branches: [main]
permissions:
  checks: read
  contents: read
jobs:
  site-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Workers Builds built the push
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Must match the site Worker's build watch-path EXCLUDES in the Cloudflare dashboard
          # (docs/06, "Deploying") and monitor.yml's "main is deployed". Change all three together.
          served=""
          if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            served="(no previous commit)"
          elif ! files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq '.files[].filename'); then
            served="(could not list the changed files)"
          else
            while read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                docs/*|README.md|designs/*) ;;
                *) served="$served $f" ;;
              esac
            done <<< "$files"
          fi
          if [ -z "$served" ]; then echo "$SHA changes only files the site build ignores; no build expected"; exit 0; fi
          echo "Served changes:$served"

          seen=""
          for poll in $(seq 0 12); do
            if [ "$poll" -gt 0 ]; then sleep 60; fi
            build=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=Workers%20Builds%3A%20patrickjv-eng-site" \
              --jq '([.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages" and .name == "Workers Builds: patrickjv-eng-site")][0] // empty) | "\(.status) \(.conclusion) \(.details_url)"') || build=""
            case "$build" in
              "")
                echo "minute $poll: no site build for $SHA yet" ;;
              "completed success "*)
                echo "Workers Builds: patrickjv-eng-site built and deployed $SHA"
                exit 0 ;;
              completed\ *)
                rest=${build#completed }
                echo "::error title=Workers Builds failed: patrickjv-eng-site::Workers Builds: patrickjv-eng-site concluded '${rest%% *}' for $SHA; the site was NOT updated. ${rest#* }"
                echo "### Workers Builds FAILED: patrickjv-eng-site at $SHA (${rest%% *})" >> "$GITHUB_STEP_SUMMARY"
                exit 1 ;;
              *)
                seen=1
                echo "minute $poll: site build is ${build%% *}" ;;
            esac
          done
          if [ -n "$seen" ]; then
            echo "::notice::the site build for $SHA is still running after 12 minutes; monitor.yml alerts if it fails"
            exit 0
          fi
          echo "::error title=No Workers Builds site build::Cloudflare didn't build $SHA: retry the build in the dashboard or push an empty commit. (No 'Workers Builds: patrickjv-eng-site' check run after 12 minutes; served changes:$served)"
          echo "### Cloudflare didn't build $SHA (no site build after 12 minutes)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
