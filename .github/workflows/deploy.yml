# Deploy on push to main: tests (incl. the build drift check) → deploy all three Workers → smoke.
# Inert until the repo has the CLOUDFLARE_API_TOKEN secret (and CLOUDFLARE_ACCOUNT_ID variable).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when deploy credentials are not configured
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping deploy"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - if: steps.gate.outputs.go == 'true'
        run: npm run deploy
      - name: Smoke the live site
        if: steps.gate.outputs.go == 'true'
        run: node smoke.mjs https://patrickjv.com --aliases --mcp
