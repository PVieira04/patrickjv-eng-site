<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Patrick Vieira</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* IBM Plex, self-hosted (SIL Open Font License: /fonts/OFL.txt). This page's CSP allows only this <style>, by hash. */
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 400 600; font-display: swap; src: url(/fonts/ibm-plex-sans-latin-var.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/ibm-plex-mono-latin-400.woff2) format("woff2"); }
:root { --bg: #0c0e11; --ink: #e7e9ec; --muted: #9aa3ae; --line: #262b33; --line-strong: #3a414c; --grid: rgba(255, 255, 255, 0.028); --signal: #ffb547; }
@media (prefers-color-scheme: light) {
  :root { --bg: #f4f3ee; --ink: #14171c; --muted: #535b66; --line: #d9d7cf; --line-strong: #b9b6ab; --grid: rgba(20, 23, 28, 0.04); --signal: #a64b00; }
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem clamp(16px, 4vw, 40px);
  background-color: var(--bg); color: var(--ink);
  background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 1.0625rem; line-height: 1.6;
}
main { max-width: 34rem; width: 100%; border: 1px solid var(--line); border-top: 2px solid var(--signal); padding: 2rem clamp(1rem, 4vw, 2rem); }
.label { margin: 0; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.label b { color: var(--signal); font-weight: 400; }
h1 { margin: 0.75rem 0 0; font-weight: 500; font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.1; letter-spacing: -0.02em; }
p { margin: 1rem 0 0; }
a { color: inherit; text-decoration-color: var(--line-strong); text-underline-offset: 0.2em; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
a:hover { color: var(--signal); text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="label"><b>404</b> / Not found</p>
  <h1>There is nothing at this address.</h1>
  <p>The page may have moved, or the link may be mistyped.</p>
  <p><a href="/">Go to patrickjv.com</a></p>
</main>
</body>
</html>
