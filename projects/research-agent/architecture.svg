<svg class="arch" role="img" aria-labelledby="graph-title" aria-describedby="graph-desc" viewBox="0 0 360 420" xmlns="http://www.w3.org/2000/svg">
<title id="graph-title">The LangGraph graph: plan, an approval interrupt, an analyse loop of agent and tools, the critic, and the report.</title>
<desc id="graph-desc">The run starts at plan, which writes a structured plan. approve pauses the run with a LangGraph interrupt until a person resumes it with approve, edit or reject; apply_decision checks the answer and sends an invalid one back to approve. After approval, agent (the analyst model) calls tools, which runs the MCP tools through a ToolNode, and the two alternate until the analyst stops calling tools. critique then runs the critic; a verdict of revise starts a new pass at agent, and pass goes on to report. A rejected plan, a crossed cap on tool calls or tokens, or an error routes straight to report. A SQLite checkpointer saves the state after every step, so a run can stop and resume.</desc>
<defs><marker id="graph-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L8 4L0 8z"/></marker></defs>
<g>
<rect class="box" x="64" y="10" width="132" height="44" rx="4"/><text x="130" y="30" text-anchor="middle">plan</text><text class="small" x="130" y="46" text-anchor="middle">structured</text>
<rect class="hl" x="64" y="80" width="132" height="44" rx="4"/><text x="130" y="100" text-anchor="middle">approve</text><text class="small" x="130" y="116" text-anchor="middle">interrupt()</text>
<rect class="box" x="64" y="150" width="132" height="44" rx="4"/><text x="130" y="176" text-anchor="middle">apply_decision</text>
<rect class="box" x="64" y="220" width="132" height="44" rx="4"/><text x="130" y="240" text-anchor="middle">agent</text><text class="small" x="130" y="256" text-anchor="middle">analyst, caps</text>
<rect class="box" x="64" y="290" width="132" height="44" rx="4"/><text x="130" y="310" text-anchor="middle">critique</text><text class="small" x="130" y="326" text-anchor="middle">critic, Verdict</text>
<rect class="box" x="64" y="360" width="132" height="44" rx="4"/><text x="130" y="380" text-anchor="middle">report</text><text class="small" x="130" y="396" text-anchor="middle">.json and .md</text>
<rect class="box out" x="226" y="10" width="130" height="44" rx="4"/><text x="291" y="30" text-anchor="middle">Checkpointer</text><text class="small" x="291" y="46" text-anchor="middle">after each step</text>
<rect class="box" x="226" y="80" width="130" height="44" rx="4"/><text x="291" y="100" text-anchor="middle">A person</text><text class="small" x="291" y="116" text-anchor="middle">Command(resume)</text>
<rect class="box" x="226" y="220" width="130" height="44" rx="4"/><text x="291" y="240" text-anchor="middle">tools</text><text class="small" x="291" y="256" text-anchor="middle">ToolNode, MCP</text>
<rect class="box out" x="226" y="290" width="130" height="44" rx="4"/><text x="291" y="310" text-anchor="middle">Any stop</text><text class="small" x="291" y="326" text-anchor="middle">reject, cap, error</text>
<path class="edge" d="M130 54V78" marker-end="url(#graph-arrow)"/>
<path class="edge" d="M130 124V148" marker-end="url(#graph-arrow)"/>
<path class="edge" d="M130 194V218" marker-end="url(#graph-arrow)"/>
<path class="edge" d="M130 264V288" marker-end="url(#graph-arrow)"/>
<path class="edge" d="M130 334V358" marker-end="url(#graph-arrow)"/>
<path class="edge" d="M226 102H198" marker-end="url(#graph-arrow)"/>
<path class="edge" d="M196 236H224" marker-end="url(#graph-arrow)"/>
<path class="edge" d="M226 250H198" marker-end="url(#graph-arrow)"/>
<path class="edge" d="M64 172C40 172 40 102 62 102" marker-end="url(#graph-arrow)"/>
<text class="small" x="52" y="141">invalid</text>
<path class="edge" d="M64 312C40 312 40 242 62 242" marker-end="url(#graph-arrow)"/>
<text class="small" x="52" y="281">revise</text>
<path class="edge" d="M291 334V382H198" marker-end="url(#graph-arrow)"/>
</g>
</svg>
