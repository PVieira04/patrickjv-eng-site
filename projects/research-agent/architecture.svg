<svg class="arch" role="img" aria-labelledby="arch-title" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
<title id="arch-title">The research agent's loop: a question becomes a plan, a person approves it, the analyst runs Python in a sandbox through the research MCP server, a critic reviews the work, and the agent writes a report.</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L8 4L0 8z"/></marker></defs>
<g>
<rect class="box" x="10" y="20" width="110" height="44" rx="4"/><text x="65" y="47" text-anchor="middle">Question</text>
<rect class="box" x="175" y="20" width="110" height="44" rx="4"/><text x="230" y="47" text-anchor="middle">Plan</text>
<rect class="box" x="340" y="20" width="110" height="44" rx="4"/><text x="395" y="41" text-anchor="middle">Approval</text><text class="small" x="395" y="56" text-anchor="middle">a person</text>
<rect class="box" x="505" y="20" width="125" height="44" rx="4"/><text x="567" y="41" text-anchor="middle">Analyse</text><text class="small" x="567" y="56" text-anchor="middle">loop, with caps</text>
<rect class="box" x="505" y="130" width="125" height="44" rx="4"/><text x="567" y="157" text-anchor="middle">Critic</text>
<rect class="box" x="340" y="130" width="110" height="44" rx="4"/><text x="395" y="157" text-anchor="middle">Report</text>
<rect class="hl" x="175" y="230" width="275" height="54" rx="4"/><text x="312" y="252" text-anchor="middle">Research MCP server</text><text class="small" x="312" y="270" text-anchor="middle">sandbox: no network, read-only data</text>
<path class="edge" d="M120 42H173" marker-end="url(#arrow)"/>
<path class="edge" d="M285 42H338" marker-end="url(#arrow)"/>
<path class="edge" d="M450 42H503" marker-end="url(#arrow)"/>
<path class="edge" d="M567 64V128" marker-end="url(#arrow)"/>
<path class="edge" d="M505 152H452" marker-end="url(#arrow)"/>
<path class="edge" d="M530 64C530 100 470 200 452 240" marker-end="url(#arrow)"/>
</g>
</svg>
